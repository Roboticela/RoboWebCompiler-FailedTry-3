<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>RoboWebCompiler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Roboto, sans-serif;
        }
    </style>
</head>

<body>
    <svg width="320" height="200" viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7C3AED" />
                <stop offset="50%" stop-color="#06B6D4" />
                <stop offset="100%" stop-color="#22C55E" />
            </linearGradient>

            <filter id="glow">
                <feGaussianBlur stdDeviation="5" result="blur" />
                <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>

        <!-- Background -->
        <rect width="320" height="200" rx="28" fill="#0B1020" />

        <!-- Decorative orbit -->
        <ellipse cx="160" cy="100" rx="105" ry="48" fill="none" stroke="url(#aurora)" stroke-width="2" opacity=".35"
            transform="rotate(-18 160 100)" />

        <!-- Main glowing shape -->
        <path d="M160 42
           C190 42 214 65 214 94
           C214 128 184 158 160 168
           C136 158 106 128 106 94
           C106 65 130 42 160 42Z" fill="url(#aurora)" filter="url(#glow)" opacity=".9" />

        <!-- Inner cut -->
        <path d="M160 63
           C178 63 192 77 192 94
           C192 113 175 132 160 141
           C145 132 128 113 128 94
           C128 77 142 63 160 63Z" fill="#0B1020" />

        <!-- Center star -->
        <path d="M160 72
           L166 88
           L183 94
           L166 100
           L160 117
           L154 100
           L137 94
           L154 88Z" fill="white" filter="url(#glow)" />

        <!-- Small stars -->
        <circle cx="70" cy="55" r="2" fill="#fff" />
        <circle cx="255" cy="70" r="2.5" fill="#fff" />
        <circle cx="82" cy="145" r="1.5" fill="#06B6D4" />
        <circle cx="245" cy="145" r="1.5" fill="#22C55E" />
    </svg>
</body>

</html>
